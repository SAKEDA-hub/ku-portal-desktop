name: Review checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for f in app/server.js app/server/*.js desktop/*.js desktop/ui/*.js mobile/android/app/src/main/assets/*.js; do
            node --check "$f"
          done
      - name: Run tests
        run: node --test tests/*.test.js
