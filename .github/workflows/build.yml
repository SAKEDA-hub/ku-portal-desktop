# Сборка KU Portal: настольное приложение (Windows / macOS / Linux) и Android APK.
# Готовые файлы — во вкладке Actions → запуск → Artifacts.
# Тег v* (например, v1.0.0) — дополнительно создаётся GitHub Release со всеми установщиками.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Проверка исходников
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Синтаксис
        run: |
          for f in app/server.js app/public/app.js app/public/i18n.js app/public/services.js app/exam-sync/handler.js \
                   desktop/main.js desktop/config.js desktop/preload.js desktop/settings-preload.js \
                   desktop/ui/settings.js desktop/ui/error.js desktop/ui/loading.js \
                   mobile/android/app/src/main/assets/bridge.js mobile/android/app/src/main/assets/ui/connect.js; do
            node --check "$f"
          done
      - name: Тесты
        run: node --test tests/*.test.js

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # без сертификата подписи (macOS/Windows)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: KU-Portal-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ключ подписи (если заданы секреты ANDROID_KEYSTORE_BASE64 и др.)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ku.jks"
            echo "KU_KEYSTORE_PATH=$RUNNER_TEMP/ku.jks" >> "$GITHUB_ENV"
            echo "Подпись: ключ из секретов"
          else
            echo "Подпись: отладочный ключ (секреты не заданы)"
          fi
      - name: Сборка
        env:
          KU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk out/KU-Portal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KU-Portal-android
          if-no-files-found: error
          path: mobile/android/out/KU-Portal.apk

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
