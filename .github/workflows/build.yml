# Сборка и публикация KU Portal:
#   - программа для компьютера: Windows (установщик + portable), macOS (Apple Silicon / Intel), Linux (AppImage);
#   - приложение для телефона: Android APK.
# После каждого push в main готовые файлы публикуются в GitHub Releases (последний релиз),
# поэтому ссылки вида .../releases/latest/download/<файл> в README всегда ведут на свежую сборку.
# Журналы сборки сохраняются в ветки ci/* (чтобы их можно было прочитать без веб-интерфейса).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  KU_VERSION_NAME: 1.0.${{ github.run_number }}
  KU_VERSION_CODE: ${{ github.run_number }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверка исходников
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Синтаксис и тесты
        shell: bash
        run: |
          set -o pipefail
          {
            for f in app/server.js app/public/app.js app/public/i18n.js app/public/services.js app/exam-sync/handler.js \
                     desktop/main.js desktop/config.js desktop/preload.js desktop/settings-preload.js \
                     desktop/ui/settings.js desktop/ui/error.js desktop/ui/loading.js \
                     mobile/android/app/src/main/assets/bridge.js mobile/android/app/src/main/assets/ui/connect.js \
                     tests/smoke/cdp.js tests/smoke/portal-scenario.js tests/smoke/desktop-smoke.js tests/smoke/android-smoke.js; do
              node --check "$f"
            done
            node --test tests/*.test.js
          } 2>&1 | tee build.log
      - name: Журнал → ветка ci/check
        if: always()
        shell: bash
        run: bash .github/push-log.sh check "${{ job.status }}"
        env:
          GH_PUSH_TOKEN: ${{ github.token }}

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, args: --win, exe: 'desktop/dist/win-unpacked/KU Portal.exe', wrap: '' }
          - { os: macos-latest, name: macos, args: --mac, exe: 'desktop/dist/mac-arm64/KU Portal.app/Contents/MacOS/KU Portal', wrap: '' }
          - { os: ubuntu-latest, name: linux, args: --linux, exe: 'desktop/dist/linux-unpacked/ku-portal-desktop', wrap: 'xvfb-run -a' }
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # без платного сертификата подписи
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сборка
        shell: bash
        working-directory: desktop
        run: |
          set -o pipefail
          { npm install --no-audit --no-fund && npx electron-builder ${{ matrix.args }} --publish never -c.extraMetadata.version=$KU_VERSION_NAME && ls -la dist; } 2>&1 | tee ../build.log
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/dist/KU-Portal-Setup.exe
            desktop/dist/KU-Portal-Portable.exe
            desktop/dist/KU-Portal-mac-*.dmg
            desktop/dist/KU-Portal-linux.AppImage
      - name: Автопроверка готовой программы (вход, записи, AI, кабинет, онлайн-экзамен, встроенный сервер)
        shell: bash
        timeout-minutes: 15
        run: |
          set -o pipefail
          ${{ matrix.wrap }} node tests/smoke/desktop-smoke.js "${{ matrix.exe }}" --real https://ku-portal.onrender.com 2>&1 | tee -a build.log
      - name: Журнал → ветка ci/desktop-${{ matrix.name }}
        if: always()
        shell: bash
        run: bash .github/push-log.sh "desktop-${{ matrix.name }}" "${{ job.status }}"
        env:
          GH_PUSH_TOKEN: ${{ github.token }}

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ключ подписи (если заданы секреты ANDROID_KEYSTORE_BASE64 и др.)
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ku.jks"
            echo "KU_KEYSTORE_PATH=$RUNNER_TEMP/ku.jks" >> "$GITHUB_ENV"
          fi
      - name: Сборка
        shell: bash
        working-directory: mobile/android
        env:
          KU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          { ./gradlew --no-daemon --stacktrace assembleRelease assembleDebug && mkdir -p out && cp app/build/outputs/apk/release/app-release.apk out/KU-Portal.apk && ls -la out; } 2>&1 | tee ../../build.log
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: mobile/android/out/KU-Portal.apk
      - name: KVM для эмулятора
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Автопроверка APK на эмуляторе Android 14
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tests/smoke/android-smoke.sh
      - name: Журнал → ветка ci/android
        if: always()
        shell: bash
        run: bash .github/push-log.sh android "${{ job.status }}"
        env:
          GH_PUSH_TOKEN: ${{ github.token }}

  release:
    name: Публикация (GitHub Releases)
    needs: [desktop, android]
    # публикуем только если ВСЕ сборки и автопроверки прошли — иначе остаётся прошлый рабочий релиз
    if: ${{ !cancelled() && needs.desktop.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Публичный репозиторий только с готовыми файлами (исходники остаются закрытыми).
      # Нужен секрет RELEASES_TOKEN (fine-grained PAT: Contents — Read and write на этот репозиторий);
      # без секрета шаг публикации туда просто пропускается.
      PUBLIC_REPO: ${{ vars.PUBLIC_RELEASES_REPO || 'SAKEDA-hub/ku-portal-project' }}
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Версия и описание
        id: meta
        shell: bash
        run: |
          ls -la out
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="${GITHUB_REF#refs/tags/}"; else TAG="v1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          B="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          {
            echo "## Компьютер"
            echo "- Windows — установщик: [KU-Portal-Setup.exe]($B/KU-Portal-Setup.exe), без установки: [KU-Portal-Portable.exe]($B/KU-Portal-Portable.exe)"
            echo "- macOS — Apple Silicon (M1–M4): [KU-Portal-mac-arm64.dmg]($B/KU-Portal-mac-arm64.dmg), Intel: [KU-Portal-mac-x64.dmg]($B/KU-Portal-mac-x64.dmg)"
            echo "- Linux: [KU-Portal-linux.AppImage]($B/KU-Portal-linux.AppImage)"
            echo ""
            echo "## Телефон"
            echo "- Android: [KU-Portal.apk]($B/KU-Portal.apk)"
            echo ""
            echo "Приложения открывают сайт портала https://ku-portal.onrender.com — те же аккаунты, оценки, расписание, AI-помощник и онлайн-экзамен."
            echo ""
            echo "Скачать всегда свежую версию: https://github.com/SAKEDA-hub/ku-portal-project · установка и инструкция: https://github.com/${GITHUB_REPOSITORY}#-инструкция-для-пользователей"
            echo ""
            echo "Сборка из коммита ${GITHUB_SHA::7}. Перед публикацией каждая программа автоматически проверена: Windows, macOS и Linux — запуск, вход, оценки, расписание, AI-помощник, кабинет, онлайн-экзамен и возврат, встроенный сервер; Android — на эмуляторе Android 14, включая уведомления и сохранение файлов."
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: KU Portal ${{ steps.meta.outputs.tag }}
          body_path: notes.md
          make_latest: 'true'
          files: out/*
      - name: Описание для публичного репозитория
        if: ${{ env.RELEASES_TOKEN != '' }}
        shell: bash
        run: |
          {
            echo "🌐 Сайт: https://ku-portal.onrender.com"
            echo ""
            echo "- Windows — установщик: KU-Portal-Setup.exe, без установки: KU-Portal-Portable.exe"
            echo "- Android 7.0+: KU-Portal.apk"
            echo "- macOS — Apple Silicon: KU-Portal-mac-arm64.dmg, Intel: KU-Portal-mac-x64.dmg"
            echo "- Linux: KU-Portal-linux.AppImage"
            echo ""
            echo "Файлы — в разделе Assets ниже. Инструкция по установке: https://github.com/${PUBLIC_REPO}#установка"
          } > notes-public.md
      - name: Публикация в публичный репозиторий (только файлы)
        if: ${{ env.RELEASES_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ env.RELEASES_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: KU Portal ${{ steps.meta.outputs.tag }}
          body_path: notes-public.md
          make_latest: 'true'
          files: out/*
      - name: Итог → ветка ci/release
        if: always()
        shell: bash
        run: |
          echo "tag=${{ steps.meta.outputs.tag }} desktop=${{ needs.desktop.result }} android=${{ needs.android.result }}" > build.log
          ls -la out >> build.log 2>&1 || true
          bash .github/push-log.sh release "${{ job.status }}"
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
