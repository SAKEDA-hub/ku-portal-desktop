plugins {
    id 'com.android.application'
}

android {
    namespace 'kz.ku.portal'
    compileSdk 34

    defaultConfig {
        applicationId 'kz.ku.portal'
        minSdk 24
        targetSdk 34
        // В CI номер сборки подставляется из GitHub Actions (растёт с каждым релизом)
        versionCode((System.getenv('KU_VERSION_CODE') ?: '1') as int)
        versionName(System.getenv('KU_VERSION_NAME') ?: '1.0.0')
        // Сервер по умолчанию (экран «Подключение»)
        buildConfigField 'String', 'DEFAULT_SERVER', '"https://ku-portal.alwaysdata.net"'
    }

    buildFeatures {
        buildConfig true
    }

    // Подпись релиза: если в CI заданы секреты keystore — подписываем им,
    // иначе релиз подписывается отладочным ключом (APK всё равно устанавливается вручную).
    def ksPath = System.getenv('KU_KEYSTORE_PATH')
    def hasKs = ksPath != null && new File(ksPath).exists()
    signingConfigs {
        release {
            if (hasKs) {
                storeFile file(ksPath)
                storePassword System.getenv('KU_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KU_KEY_ALIAS')
                keyPassword System.getenv('KU_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = hasKs ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
